services:
  steam-family-picker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steam-family-picker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/steam_family.db
    volumes:
      - ./data:/app/data
    networks:
      - steam-picker-net

networks:
  steam-picker-net:
    name: steam-picker-net
    driver: bridge
