<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="steamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#2a475e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#66c0f4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="8" fill="#171a21"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#blueGlow)" stroke-width="1.2" opacity="0.6"/>

  <!-- Stylized Steam Family Icon -->
  <g filter="url(#glow)">
    <!-- Main steam body circle -->
    <circle cx="20" cy="11.5" r="4.2" fill="none" stroke="#66c0f4" stroke-width="2"/>
    <circle cx="20" cy="11.5" r="2" fill="#66c0f4"/>

    <!-- Small arm circle -->
    <circle cx="10.5" cy="20.5" r="3.2" fill="none" stroke="#66c0f4" stroke-width="1.8"/>
    <circle cx="10.5" cy="20.5" r="1.4" fill="#66c0f4"/>

    <!-- Connecting Rod -->
    <path d="M11.8 18.2 L17.5 13.5" stroke="#66c0f4" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Secondary mini circle for family motif -->
    <circle cx="23.5" cy="21.5" r="2.2" fill="#ffc82c"/>
    <path d="M19 15 L22 19.5" stroke="#ffc82c" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
